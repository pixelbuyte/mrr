name: rulesync
description: Sync AI agent rule files across all tools
author: rulesync contributors
branding:
  icon: refresh-cw
  color: purple
inputs:
  mode:
    description: 'check (default) or sync'
    required: false
    default: 'check'
  source:
    description: 'Source file path'
    required: false
    default: 'AGENTS.md'
runs:
  using: 'node20'
  main: 'dist/action/index.js'
