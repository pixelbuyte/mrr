<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Aroma Fridge</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0f16;overflow:hidden;font-family:'SF Pro Display','Segoe UI',system-ui,sans-serif;cursor:crosshair;user-select:none}
canvas{display:block}

#hud{
  position:fixed;top:0;left:0;right:0;padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;
  color:#fff;pointer-events:none;z-index:5;opacity:0;transition:opacity .5s .2s;
}
#hud.show{opacity:1}
.pill{
  background:rgba(10,15,24,.65);border:1px solid rgba(255,255,255,.1);
  padding:9px 18px;border-radius:12px;backdrop-filter:blur(12px);
  font-size:14px;font-weight:600;letter-spacing:.4px;
  display:flex;align-items:center;gap:9px;transition:border-color .3s,transform .15s;
}
.pill.pop{animation:pillPop .25s ease}
@keyframes pillPop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:0 0 12px 3px var(--c,#fff);background:var(--c,#fff);transition:all .35s}
#multiplier{background:linear-gradient(135deg,#ff6b6b,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;font-size:16px;display:none}

#overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:18px;z-index:10;color:#fff;text-align:center;
  background:radial-gradient(ellipse at 50% 55%,rgba(20,40,80,.25),rgba(10,15,22,.94) 70%);
  transition:opacity .4s;
}
#overlay.fade{opacity:0;pointer-events:none}
#overlay h1{font-size:46px;font-weight:800;letter-spacing:1px;line-height:1}
#overlay h1 span{background:linear-gradient(135deg,#8fe3ff,#c7f5d9,#ffe6a3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#overlay .sub{font-size:16px;opacity:.6;max-width:410px;line-height:1.6}
#overlay .final-score{font-size:56px;font-weight:800;background:linear-gradient(135deg,#ffd93d,#ff6b6b,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#overlay .stat-row{display:flex;gap:26px;font-size:14px;opacity:.55;flex-wrap:wrap;justify-content:center}
.play-btn{cursor:pointer;border:none;border-radius:14px;padding:16px 44px;font-size:17px;font-weight:700;color:#0a0f16;background:linear-gradient(135deg,#8fe3ff,#7CE38B);box-shadow:0 4px 24px rgba(120,220,255,.3);transition:transform .12s,box-shadow .12s;pointer-events:all}
.play-btn:hover{transform:scale(1.04);box-shadow:0 6px 30px rgba(120,220,255,.5)}

#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;transition:opacity .12s}
.float-txt{position:fixed;pointer-events:none;z-index:6;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:floatUp .65s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(1.2)}}
.miss-txt{animation:missShake .5s ease forwards}
@keyframes missShake{0%{opacity:1;transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}100%{opacity:0;transform:translateY(-20px)}}
#cursor-dot{position:fixed;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);transform:translate(-50%,-50%);z-index:6;pointer-events:none;transition:left .25s cubic-bezier(.3,0,.2,1),top .25s cubic-bezier(.3,0,.2,1),transform .08s;display:none}
#streak{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:180px;height:5px;border-radius:3px;background:rgba(255,255,255,.06);z-index:5;overflow:hidden;opacity:0;transition:opacity .4s}
#streak.show{opacity:1}
#streak-fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#38B6FF,#7CE38B,#ffd93d);transition:width .25s}
#level-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:28px;font-weight:800;color:#fff;z-index:8;pointer-events:none;text-shadow:0 0 30px rgba(56,182,255,.6);opacity:0;transition:all .4s cubic-bezier(.2,.8,.3,1)}
#level-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div id="hud">
  <div class="pill" id="target-pill"><span class="dot"></span><span id="target-label">Find: Orange</span></div>
  <div class="pill" id="score-pill"><span id="multiplier">x2</span>Score: <span id="score-num">0</span></div>
  <div class="pill" id="timer-pill">Time: <span id="timer-num">60</span></div>
</div>
<div id="overlay">
  <h1><span>Aroma Fridge</span></h1>
  <div class="sub">Scent bubbles rise from the food inside. Click the one matching the target aroma. Chain correct clicks for combo multipliers!</div>
  <button class="play-btn" id="playBtn">Open the Fridge</button>
</div>
<div id="flash"></div>
<div id="cursor-dot"></div>
<div id="streak"><div id="streak-fill"></div></div>
<div id="level-banner"></div>

<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const DEMO = new URLSearchParams(location.search).get('demo') === '1';

// ═══════════ RENDERER / SCENE ═══════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f16);
scene.fog = new THREE.FogExp2(0x0a0f16, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.6, 2.7, 8.2);

const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ═══════════ ENVIRONMENT MAP (procedural — gives metal/glass real reflections) ═══════════
(function buildEnv(){
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x3d4756);
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.MeshBasicMaterial({color:0xf4f0e8}));
  ceiling.position.set(0,12,0); ceiling.rotation.x = Math.PI/2; envScene.add(ceiling);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(10,14), new THREE.MeshBasicMaterial({color:0xbcd6ff}));
  win.position.set(-14,5,-2); win.rotation.y = Math.PI/2; envScene.add(win);
  const warm = new THREE.Mesh(new THREE.PlaneGeometry(8,8), new THREE.MeshBasicMaterial({color:0xffe0b0}));
  warm.position.set(13,4,4); warm.rotation.y = -Math.PI/2.2; envScene.add(warm);
  const floorP = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.MeshBasicMaterial({color:0x2a2620}));
  floorP.position.set(0,-6,0); floorP.rotation.x = -Math.PI/2; envScene.add(floorP);
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;
})();

// ═══════════ LIGHTS ═══════════
scene.add(new THREE.AmbientLight(0x2a3548, 0.35));
scene.add(new THREE.HemisphereLight(0x9fc0ff, 0x1a1410, 0.5));

const key = new THREE.DirectionalLight(0xfff2e0, 1.15);
key.position.set(6, 11, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 30;
key.shadow.camera.left=-7; key.shadow.camera.right=7; key.shadow.camera.top=8; key.shadow.camera.bottom=-2;
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x88a0d0, 0.3);
fill.position.set(-6, 4, 3);
scene.add(fill);

// interior LED (on when door opens) — bright point lights (r160 candela units) to flood the interior
const ledTop = new THREE.PointLight(0xfff6e6, 0, 6, 2); ledTop.position.set(0, 3.7, 0.1); scene.add(ledTop);
const ledMid = new THREE.PointLight(0xfff6e6, 0, 6, 2); ledMid.position.set(0, 2.4, 0.3); scene.add(ledMid);
const ledLow = new THREE.PointLight(0xfff2dc, 0, 6, 2); ledLow.position.set(0, 1.2, 0.3); scene.add(ledLow);
const ledFront = new THREE.PointLight(0xffffff, 0, 7, 2); ledFront.position.set(1.2, 2.5, 1.4); scene.add(ledFront);

// ═══════════ ROOM ═══════════
// wood-ish floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(50,50),
  new THREE.MeshStandardMaterial({color:0x26211a, roughness:0.75, metalness:0.05})
);
floor.rotation.x = -Math.PI/2; floor.position.y = 0; floor.receiveShadow = true; scene.add(floor);

// back wall
const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(40,20),
  new THREE.MeshStandardMaterial({color:0x1c2534, roughness:0.95})
);
wall.position.set(0,10,-3.2); scene.add(wall);

// ═══════════ MATERIALS ═══════════
const steel = new THREE.MeshStandardMaterial({color:0xb8bcc2, metalness:1.0, roughness:0.34});
const steelDark = new THREE.MeshStandardMaterial({color:0x8b9096, metalness:1.0, roughness:0.4});
const linerMat = new THREE.MeshStandardMaterial({color:0xf4f7fa, roughness:0.6, metalness:0.0, emissive:0xeaf1f7, emissiveIntensity:0.0, side:THREE.DoubleSide});
const gasketMat = new THREE.MeshStandardMaterial({color:0x2b2f36, roughness:0.85});
const glassShelf = new THREE.MeshPhysicalMaterial({color:0xcfe0ee, metalness:0, roughness:0.08, transmission:0.9, transparent:true, opacity:0.55, thickness:0.3, ior:1.4});
const binPlastic = new THREE.MeshPhysicalMaterial({color:0xdff0ff, metalness:0, roughness:0.15, transmission:0.75, transparent:true, opacity:0.4, thickness:0.4, ior:1.35});
const chromeTrim = new THREE.MeshStandardMaterial({color:0xd8dce0, metalness:1.0, roughness:0.2});

// helper: rounded box via a box + no rounding (rely on materials/lighting); with thin bevel strips omitted for perf
function box(w,h,d,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.castShadow=true;m.receiveShadow=true;return m;}
function boxNoFront(w,h,d,mat){const inv=mat.clone();inv.visible=false;const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mat,mat,mat,mat,inv,mat]);m.castShadow=true;m.receiveShadow=true;return m;}

// ═══════════ FRIDGE BODY ═══════════
const fridge = new THREE.Group();
fridge.position.set(0,0,0);
scene.add(fridge);

const BODY_W = 3.0, BODY_H = 4.6, BODY_D = 2.5;
const bodyCX = 0, bodyCY = BODY_H/2 + 0.12, bodyCZ = -0.35;

// outer stainless shell (open front)
const shell = boxNoFront(BODY_W, BODY_H, BODY_D, steel);
shell.position.set(bodyCX, bodyCY, bodyCZ);
fridge.add(shell);

// top + side trim edges (chamfer illusion)
const topCap = box(BODY_W+0.05, 0.1, BODY_D+0.05, steelDark);
topCap.position.set(bodyCX, bodyCY+BODY_H/2, bodyCZ); fridge.add(topCap);
// little feet
[[-1.3,-1.05],[1.3,-1.05],[-1.3,0.55],[1.3,0.55]].forEach(([x,z])=>{
  const foot = box(0.18,0.24,0.18, steelDark); foot.position.set(x,0.12,bodyCZ+z*0.0+z); fridge.add(foot);
});

// interior white liner (open front)
const IN_W=2.66, IN_H=BODY_H-0.28, IN_D=BODY_D-0.28;
const liner = boxNoFront(IN_W, IN_H, IN_D, linerMat);
liner.position.set(bodyCX, bodyCY, bodyCZ+0.02);
fridge.add(liner);

// door gasket frame (dark seal around opening)
const frontZ = bodyCZ + BODY_D/2;
function gasketBar(w,h,x,y){const b=box(w,h,0.06,gasketMat);b.position.set(x,y,frontZ-0.02);fridge.add(b);}
gasketBar(BODY_W-0.1,0.1, bodyCX, bodyCY+BODY_H/2-0.12);
gasketBar(BODY_W-0.1,0.1, bodyCX, bodyCY-BODY_H/2+0.12);
gasketBar(0.1,BODY_H-0.24, bodyCX-BODY_W/2+0.12, bodyCY);
gasketBar(0.1,BODY_H-0.24, bodyCX+BODY_W/2-0.12, bodyCY);

// back interior LED light panel
const ledPanel = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 2.6), new THREE.MeshBasicMaterial({color:0xfff4dc, transparent:true, opacity:0.0}));
ledPanel.position.set(0, 2.6, bodyCZ-IN_D/2+0.03);
fridge.add(ledPanel);

// ═══════════ INTERIOR SHELVES ═══════════
const shelfZ = bodyCZ + 0.15;
const shelfYs = [1.55, 2.45, 3.35];   // three glass shelves
shelfYs.forEach(y=>{
  const g = new THREE.Group();
  const glass = box(IN_W-0.14, 0.05, IN_D-0.55, glassShelf);
  glass.position.set(0, y, shelfZ);
  g.add(glass);
  // chrome front rail
  const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025, IN_W-0.14, 12), chromeTrim);
  rail.rotation.z = Math.PI/2;
  rail.position.set(0, y-0.02, shelfZ + (IN_D-0.55)/2);
  g.add(rail);
  fridge.add(g);
});

// crisper drawers (two, near bottom)
const crisperY = 0.78;
[-0.62, 0.62].forEach(x=>{
  const d = box(1.16, 0.5, IN_D-0.5, binPlastic);
  d.position.set(x, crisperY, shelfZ+0.05);
  fridge.add(d);
  // drawer handle lip
  const lip = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.05,0.08), chromeTrim);
  lip.position.set(x, crisperY+0.22, shelfZ+0.05+(IN_D-0.5)/2);
  fridge.add(lip);
});

// ═══════════ FOOD BUILDERS ═══════════
const foodMat = (c, rough=0.4, metal=0.05, emiss=0.12)=> new THREE.MeshStandardMaterial({color:c, roughness:rough, metalness:metal, emissive:c, emissiveIntensity:emiss});

function fruitSphere(color, r, squashY=1){
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 18), foodMat(color, 0.32, 0.02, 0.22));
  m.scale.y = squashY; m.castShadow = true; g.add(m);
  return g;
}
function stem(g, r){
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.02,0.08,6), foodMat(0x5a3d1a,0.7));
  s.position.y = r*0.9; s.castShadow=true; g.add(s);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.04,8,6), foodMat(0x3a8a2a,0.6));
  leaf.scale.set(1.4,0.25,0.7); leaf.position.set(0.04,r*0.92,0); g.add(leaf);
}
function grapeCluster(color){
  const g = new THREE.Group();
  const positions = [[0,0,0],[0.09,-0.02,0.03],[-0.08,-0.01,-0.02],[0.03,-0.1,0.05],[-0.04,-0.11,-0.04],[0.07,-0.12,-0.03],[0,-0.2,0.02],[-0.03,-0.21,-0.05]];
  positions.forEach(p=>{const m=new THREE.Mesh(new THREE.SphereGeometry(0.062,12,10), foodMat(color,0.25,0.05,0.25));m.position.set(...p);m.castShadow=true;g.add(m)});
  return g;
}
function cheeseWedge(color){
  const g = new THREE.Group();
  // triangular prism-ish wedge
  const shape = new THREE.Shape();
  shape.moveTo(0,0); shape.lineTo(0.34,0); shape.lineTo(0,0.22); shape.lineTo(0,0);
  const geo = new THREE.ExtrudeGeometry(shape, {depth:0.22, bevelEnabled:false});
  const m = new THREE.Mesh(geo, foodMat(color,0.5,0.0,0.2));
  m.rotation.y = 0.3; m.position.set(-0.15,-0.08,-0.11); m.castShadow=true; g.add(m);
  return g;
}
function leafy(color){
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), foodMat(color,0.6,0,0.2));
  base.scale.set(1,0.8,1); base.castShadow=true; g.add(base);
  for(let i=0;i<7;i++){
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.11,8,6), foodMat(new THREE.Color(color).offsetHSL(0,0,(Math.random()-.5)*0.12).getHex(),0.6));
    const a = i/7*Math.PI*2;
    leaf.scale.set(0.6,1.3,0.4);
    leaf.position.set(Math.cos(a)*0.13, 0.08+Math.random()*0.06, Math.sin(a)*0.13);
    leaf.rotation.set((Math.random()-.5)*0.6, a, (Math.random()-.5)*0.4);
    leaf.castShadow=true; g.add(leaf);
  }
  return g;
}
// realistic props (non-interactive)
function carton(color, w,h,d){
  const g = new THREE.Group();
  const b = box(w, h*0.7, d, new THREE.MeshStandardMaterial({color, roughness:0.55}));
  b.position.y = h*0.35; g.add(b);
  // gable top
  const g1 = box(w, h*0.32, d*0.5, new THREE.MeshStandardMaterial({color, roughness:0.55}));
  g1.position.y = h*0.7 + h*0.14; g.add(g1);
  return g;
}
function bottle(bodyColor, capColor, h, r, glass){
  const g = new THREE.Group();
  const mat = glass
    ? new THREE.MeshPhysicalMaterial({color:bodyColor, roughness:0.1, transmission:0.85, transparent:true, opacity:0.55, thickness:0.3, ior:1.4})
    : new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.35, metalness:0.05});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r*0.95, h*0.7, 18), mat);
  body.position.y = h*0.35; body.castShadow=true; g.add(body);
  const shoulder = new THREE.Mesh(new THREE.CylinderGeometry(r*0.35, r, h*0.18, 18), mat);
  shoulder.position.y = h*0.7 + h*0.09; g.add(shoulder);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(r*0.32, r*0.35, h*0.12, 14), mat);
  neck.position.y = h*0.7 + h*0.18 + h*0.06; g.add(neck);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r*0.36, r*0.36, h*0.1, 14), new THREE.MeshStandardMaterial({color:capColor, roughness:0.4, metalness:0.1}));
  cap.position.y = h*0.7 + h*0.18 + h*0.12 + h*0.05; g.add(cap);
  return g;
}
function jar(contentColor, h, r){
  const g = new THREE.Group();
  const glass = new THREE.MeshPhysicalMaterial({color:0xdfeef5, roughness:0.08, transmission:0.9, transparent:true, opacity:0.5, thickness:0.2, ior:1.45});
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h*0.8, 20), glass);
  body.position.y = h*0.4; body.castShadow=true; g.add(body);
  const content = new THREE.Mesh(new THREE.CylinderGeometry(r*0.9, r*0.9, h*0.62, 20), foodMat(contentColor,0.5,0,0.04));
  content.position.y = h*0.36; g.add(content);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(r*1.05, r*1.05, h*0.16, 20), new THREE.MeshStandardMaterial({color:0xc0a840, roughness:0.4, metalness:0.4}));
  lid.position.y = h*0.85; g.add(lid);
  return g;
}
function can(color, h, r){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20), new THREE.MeshStandardMaterial({color, roughness:0.28, metalness:0.75}));
  body.position.y=h/2; body.castShadow=true; g.add(body);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r*0.96,r*0.96,0.03,20), new THREE.MeshStandardMaterial({color:0xcfd4d8, roughness:0.25, metalness:0.9}));
  top.position.y=h; g.add(top);
  return g;
}
function eggCarton(){
  const g = new THREE.Group();
  const tray = box(0.62,0.1,0.42, new THREE.MeshStandardMaterial({color:0xd8d2c4, roughness:0.85}));
  tray.position.y=0.05; g.add(tray);
  for(let i=0;i<2;i++)for(let j=0;j<3;j++){
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.055,12,10), new THREE.MeshStandardMaterial({color:0xf3e9d2, roughness:0.6}));
    e.scale.y=1.3; e.position.set(-0.15+i*0.3, 0.14, -0.12+j*0.12); e.castShadow=true; g.add(e);
  }
  return g;
}
function butter(){
  const g=new THREE.Group();
  const b=box(0.34,0.12,0.2, new THREE.MeshStandardMaterial({color:0xf4e6a0, roughness:0.5}));
  b.position.y=0.06; g.add(b); return g;
}
function bowl(color){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.19,20,14,0,Math.PI*2,0,Math.PI*0.55), new THREE.MeshStandardMaterial({color:0xf0f0f0, roughness:0.3, side:THREE.DoubleSide}));
  b.rotation.x=Math.PI; b.position.y=0.12; b.castShadow=true; g.add(b);
  for(let i=0;i<9;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,8), foodMat(color,0.3,0,0.06));m.position.set((Math.random()-.5)*0.22,0.09+Math.random()*0.03,(Math.random()-.5)*0.22);g.add(m)}
  return g;
}

// ═══════════ AROMA FOODS (interactive — bubbles rise from these) ═══════════
const FOODS = [
  {name:'Orange',  emoji:'🍊', color:0xff8a2b, pos:[-0.55, 1.72, shelfZ+0.35], build:()=>{const g=fruitSphere(0xff8a2b,0.17);stem(g,0.17);return g;}},
  {name:'Lemon',   emoji:'🍋', color:0xf5df3a, pos:[ 0.15, 1.72, shelfZ+0.4], build:()=>fruitSphere(0xf5df3a,0.15,1.35)},

// ═══════════ AROMA BUBBLES ═══════════
const bubbles = [], particles = [];
const bubbleGeo = new THREE.SphereGeometry(1, 24, 24);
function spawnBubble(food){
  const size = 0.1 + Math.random()*0.08;
  const mat = new THREE.MeshPhysicalMaterial({color:food.color, transparent:true, opacity:0.82, emissive:food.color, emissiveIntensity:0.5, roughness:0.1, metalness:0.02, clearcoat:0.8, clearcoatRoughness:0.05, transmission:0.2});
  const m = new THREE.Mesh(bubbleGeo, mat);
  m.scale.setScalar(size);
  const p = food.mesh.position;
  m.position.set(p.x+(Math.random()-.5)*0.35, p.y+0.15, p.z+0.15);
  m.userData = {food, born:performance.now(), baseSize:size, speed:0.14+Math.random()*0.16, drift:(Math.random()-.5)*0.4, wobble:Math.random()*6.28, wobbleSpd:1.2+Math.random()*1.8, sinAmp:0.07+Math.random()*0.05};
  scene.add(m); bubbles.push(m);
}
function burst(pos,color,count){
  for(let i=0;i<count;i++){
    const s=0.02+Math.random()*0.03;
    const p=new THREE.Mesh(new THREE.SphereGeometry(s,6,6), new THREE.MeshBasicMaterial({color, transparent:true, opacity:1}));
    p.position.copy(pos);
    const a=Math.random()*6.28, up=1.5+Math.random()*3, sp=1.4+Math.random()*2;
    p.userData={vel:new THREE.Vector3(Math.cos(a)*sp,up,Math.sin(a)*sp), born:performance.now(), life:0.35+Math.random()*0.35};
    scene.add(p); particles.push(p);
  }
}

// ═══════════ HUD / GAME ═══════════
const $=id=>document.getElementById(id);
const hud=$('hud'), targetLabel=$('target-label'), targetDot=document.querySelector('.dot');
const scoreNum=$('score-num'), timerNum=$('timer-num'), multiplierEl=$('multiplier');
const flashEl=$('flash'), overlay=$('overlay'), playBtn=$('playBtn'), cursorDot=$('cursor-dot');
const streakBar=$('streak'), streakFill=$('streak-fill'), levelBanner=$('level-banner');

let score=0,timeLeft=60,combo=0,bestCombo=0,totalPops=0,correctPops=0;
let currentTarget=FOODS[0], playing=false, lastSpawn=0, lastTargetPick=0, level=1, levelThreshold=80;
const hex=c=>'#'+c.toString(16).padStart(6,'0');

function pickTarget(){
  let n; do{n=FOODS[Math.floor(Math.random()*FOODS.length)]}while(n===currentTarget&&FOODS.length>1);
  currentTarget=n;
  targetLabel.textContent=`Find: ${n.emoji} ${n.name}`;
  targetDot.style.setProperty('--c',hex(n.color));
  lastTargetPick=performance.now();
  $('target-pill').classList.remove('pop');void $('target-pill').offsetWidth;$('target-pill').classList.add('pop');
}
function flash(c){flashEl.style.background=c;flashEl.style.opacity='0.25';setTimeout(()=>flashEl.style.opacity='0',130)}
function floatText(x,y,t,c,miss){const e=document.createElement('div');e.className=miss?'float-txt miss-txt':'float-txt';e.textContent=t;e.style.cssText=`left:${x}px;top:${y}px;color:${c};font-size:${miss?18:20+Math.min(combo,5)*3}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),700)}
function showLevel(n){levelBanner.textContent=n<=1?'':`Level ${n}`;levelBanner.classList.add('show');setTimeout(()=>levelBanner.classList.remove('show'),1200)}

function popBubble(mesh,correct,sx,sy){
  const pos=mesh.position.clone(), col=mesh.userData.food.color;
  scene.remove(mesh); bubbles.splice(bubbles.indexOf(mesh),1); totalPops++;
  if(correct){
    correctPops++; combo++; if(combo>bestCombo)bestCombo=combo;
    const mult=Math.min(combo,5), pts=10*mult; score+=pts;
    flash('rgba(100,255,180,.35)'); burst(pos,col,6+combo*2);
    floatText(sx,sy,combo>1?`+${pts} x${combo}`:`+${pts}`,hex(col));
    pickTarget();
    if(score>=levelThreshold){level++;levelThreshold=level*level*60;showLevel(level)}
    multiplierEl.style.display=combo>1?'inline':'none'; multiplierEl.textContent=`x${Math.min(combo,5)}`;
  }else{
    combo=0; score=Math.max(0,score-3);
    flash('rgba(255,60,60,.3)'); burst(pos,0xff3333,4);
    floatText(sx,sy,'-3','#ff5555',true); multiplierEl.style.display='none';
  }
  scoreNum.textContent=score;
  $('score-pill').classList.remove('pop');void $('score-pill').offsetWidth;$('score-pill').classList.add('pop');
  streakFill.style.width=Math.min(combo/5*100,100)+'%';
}
function setLED(on){
  const v = on ? 190 : 0;
  ledTop.intensity=v; ledMid.intensity=v; ledLow.intensity=v; ledFront.intensity=on?110:0;
  ledPanel.material.opacity = on?0.9:0;
  linerMat.emissiveIntensity = on?0.1:0.0;
}

function startGame(){
  doorTarget=-Math.PI*0.62; setLED(true);
  overlay.classList.add('fade'); hud.classList.add('show'); streakBar.classList.add('show');
  playing=true; score=0;timeLeft=60;combo=0;bestCombo=0;totalPops=0;correctPops=0;level=1;levelThreshold=80;
  scoreNum.textContent='0';timerNum.textContent='60';timerNum.style.color='';$('timer-pill').style.borderColor='';
  multiplierEl.style.display='none'; pickTarget(); lastSpawn=performance.now();
}
playBtn.addEventListener('click', startGame);

function endGame(){
  playing=false; hud.classList.remove('show'); streakBar.classList.remove('show'); overlay.classList.remove('fade');
  const acc=totalPops>0?Math.round(correctPops/totalPops*100):0;
  const rank=score>=500?'S':score>=300?'A':score>=150?'B':score>=80?'C':'D';
  overlay.innerHTML=`<h1><span>Time Up!</span></h1><div class="final-score">${score}</div>
    <div class="stat-row"><span>Rank: ${rank}</span><span>Best combo: x${bestCombo}</span><span>Accuracy: ${acc}%</span><span>Level: ${level}</span></div>
    <button class="play-btn" onclick="location.reload()">Play Again</button>`;
}

// input
const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
function handlePick(cx,cy){
  if(!playing)return;
  mouse.x=(cx/innerWidth)*2-1; mouse.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(bubbles);
  if(hits.length)popBubble(hits[0].object, hits[0].object.userData.food.name===currentTarget.name, cx, cy);
}
renderer.domElement.addEventListener('pointerdown',e=>handlePick(e.clientX,e.clientY));

// demo
function w2s(v){const p=v.clone().project(camera);return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight}}
async function runDemo(){
  await new Promise(r=>setTimeout(r,700)); startGame(); cursorDot.style.display='block'; let miss=0;
  while(playing){
    const match=bubbles.find(b=>b.userData.food.name===currentTarget.name&&b.material.opacity>0.35);
    if(match){miss=0;
      let p=w2s(match.getWorldPosition(new THREE.Vector3()));
      cursorDot.style.left=p.x+'px';cursorDot.style.top=p.y+'px';
      await new Promise(r=>setTimeout(r,200));
      p=w2s(match.getWorldPosition(new THREE.Vector3()));
      cursorDot.style.left=p.x+'px';cursorDot.style.top=p.y+'px';
      await new Promise(r=>setTimeout(r,70));
      cursorDot.style.transform='translate(-50%,-50%) scale(.7)'; handlePick(p.x,p.y);
      await new Promise(r=>setTimeout(r,90)); cursorDot.style.transform='translate(-50%,-50%) scale(1)';
    }else{miss++;const any=bubbles.find(b=>b.material.opacity>0.45);
      if(any){const p=w2s(any.getWorldPosition(new THREE.Vector3()));cursorDot.style.left=p.x+'px';cursorDot.style.top=p.y+'px';
        if(miss>12){await new Promise(r=>setTimeout(r,100));cursorDot.style.transform='translate(-50%,-50%) scale(.7)';handlePick(p.x,p.y);await new Promise(r=>setTimeout(r,90));cursorDot.style.transform='translate(-50%,-50%) scale(1)';miss=0}}}
    await new Promise(r=>setTimeout(r,120));
  }
}

// ═══════════ RENDER ═══════════
const clock=new THREE.Clock(); let lastT=0;
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime(), dt=Math.min(t-lastT,0.05); lastT=t; const now=performance.now();
  doorPivot.rotation.y += (doorTarget-doorPivot.rotation.y)*0.085;

  FOODS.forEach((f,i)=>{f.mesh.rotation.y+=dt*0.25; f.mesh.position.y=f.pos[1]+Math.sin(t*1.0+i*1.8)*0.008});

  if(playing){
    const rate=Math.max(200,480-level*30);
    if(now-lastSpawn>rate+Math.random()*200){lastSpawn=now;spawnBubble(FOODS[Math.floor(Math.random()*FOODS.length)])}
    if(now-lastTargetPick>5500)pickTarget();
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i], age=(now-b.userData.born)/1000, u=b.userData;
    b.position.y+=u.speed*dt; b.position.x+=u.drift*dt+Math.sin(t*u.wobbleSpd+u.wobble)*u.sinAmp*dt; b.position.z+=0.1*dt;
    b.material.opacity=Math.max(0,0.82-age/6.5);
    b.material.emissiveIntensity=0.5+Math.sin(t*2.5+u.wobble)*0.15;
    b.scale.setScalar(u.baseSize*(1+age*0.03)*(1+Math.sin(t*3+u.wobble)*0.05));
    b.rotation.y+=dt*0.6;
    if(age>6.5){scene.remove(b);bubbles.splice(i,1)}
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i], age=(now-p.userData.born)/1000;
    if(age>p.userData.life){scene.remove(p);particles.splice(i,1);continue}
    p.userData.vel.y-=9*dt; p.position.add(p.userData.vel.clone().multiplyScalar(dt)); p.material.opacity=1-age/p.userData.life;
  }
  const sway=playing?0.4:0.5;
  camera.position.x=2.6+Math.sin(t*0.12)*sway;
  camera.position.y=2.7+Math.sin(t*0.16)*0.08;
  camera.lookAt(0.1, 2.1, 0);
  renderer.render(scene,camera);
}
animate();

setInterval(()=>{
  if(!playing)return; timeLeft--; timerNum.textContent=timeLeft;
  if(timeLeft<=10){$('timer-pill').style.borderColor='rgba(255,70,70,.5)';timerNum.style.color='#ff6b6b';if(timeLeft<=5)$('timer-pill').classList.add('pop')}
  if(timeLeft<=0)endGame();
},1000);

if(DEMO)runDemo();
</script>
